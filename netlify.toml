

[build]
  command = "yarn build"
  publish = "dist"          # Vite default output folder
  # If your app is in a subfolder, uncomment and set base:
  # base = "src"            # <-- replace "src" with your folder name if app is not at root

[build.environment]
  NODE_OPTIONS = "--max-old-space-size=4096"  # avoids memory errors during build

# Optional: if using Netlify Functions
[functions]
  directory = "netlify/functions"